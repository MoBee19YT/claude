name: Deploy frontend to GitHub Pages

# Builds frontend/ as a static site and deploys it to GitHub Pages.
# The backend is NOT deployed by this workflow - see render.yaml and
# README.md's "Deploying to production" section for that half.
#
# One-time setup required before this works:
#   1. Repo Settings -> Pages -> Source: "GitHub Actions".
#   2. Repo Settings -> Secrets and variables -> Actions -> Variables tab ->
#      add VITE_API_BASE_URL = https://<your-backend>.onrender.com/api/v1
#      (and optionally VITE_DEFAULT_LAT/LON/ZOOM to change the starting view).
#
# Trims to just `main` once this branch is merged - it currently also
# triggers on the MVP dev branch so you can verify the deploy before that.
on:
  push:
    branches:
      - main
      - claude/parking-discovery-mvp-dxxfla
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEFAULT_LAT: ${{ vars.VITE_DEFAULT_LAT }}
          VITE_DEFAULT_LON: ${{ vars.VITE_DEFAULT_LON }}
          VITE_DEFAULT_ZOOM: ${{ vars.VITE_DEFAULT_ZOOM }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
