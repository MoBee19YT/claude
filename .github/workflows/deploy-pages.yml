name: Deploy site to GitHub Pages

# Publishes the single-file app (index.html) to GitHub Pages. There is no
# build step - the file is the app.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches:
      - main
      - claude/parking-discovery-mvp-dxxfla
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html _site/
          # Serve the same page for unknown paths so deep links don't 404.
          cp index.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
