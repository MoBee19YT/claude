<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="AMD processor retail box">
  <defs>
    <linearGradient id="boxaFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A323F"/>
      <stop offset="1" stop-color="#171D27"/>
    </linearGradient>
    <linearGradient id="boxaSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2330"/>
      <stop offset="1" stop-color="#0E131B"/>
    </linearGradient>
    <linearGradient id="boxaBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B85A36"/>
      <stop offset="1" stop-color="#D98352"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="244" rx="92" ry="11" fill="#1B2942" opacity="0.12"/>

  <!-- top face -->
  <polygon points="46,52 74,32 216,32 188,52" fill="#333C4B"/>
  <!-- right face -->
  <polygon points="188,52 216,32 216,212 188,232" fill="url(#boxaSide)"/>
  <!-- front face -->
  <rect x="46" y="52" width="142" height="180" rx="3" fill="url(#boxaFront)"/>
  <rect x="46" y="52" width="142" height="180" rx="3" fill="none" stroke="#49546A" stroke-width="1" opacity="0.7"/>

  <!-- accent band -->
  <rect x="46" y="52" width="142" height="26" rx="3" fill="url(#boxaBand)"/>
  <rect x="46" y="70" width="142" height="8" fill="url(#boxaBand)"/>
  <text x="117" y="70" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFF3EC" letter-spacing="3">AMD</text>

  <!-- chip window -->
  <rect x="74" y="98" width="86" height="72" rx="6" fill="#0F141D" stroke="#3E4A5E" stroke-width="1.2"/>
  <rect x="86" y="110" width="62" height="48" rx="4" fill="#A9B3C1"/>
  <rect x="93" y="117" width="48" height="34" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

  <text x="117" y="196" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E7ECF4" letter-spacing="1">RYZEN 5</text>
  <text x="117" y="216" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#93A0B4" letter-spacing="2">7600</text>
</svg>
