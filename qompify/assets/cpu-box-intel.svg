<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Intel processor retail box">
  <defs>
    <linearGradient id="boxiFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7FC"/>
      <stop offset="1" stop-color="#D9E4F2"/>
    </linearGradient>
    <linearGradient id="boxiSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3D3E6"/>
      <stop offset="1" stop-color="#A6BBD4"/>
    </linearGradient>
    <linearGradient id="boxiBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6FAE"/>
      <stop offset="1" stop-color="#4E93D6"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="244" rx="92" ry="11" fill="#1B2942" opacity="0.12"/>

  <polygon points="46,52 74,32 216,32 188,52" fill="#E8F0F9"/>
  <polygon points="188,52 216,32 216,212 188,232" fill="url(#boxiSide)"/>
  <rect x="46" y="52" width="142" height="180" rx="3" fill="url(#boxiFront)"/>
  <rect x="46" y="52" width="142" height="180" rx="3" fill="none" stroke="#AFC3DA" stroke-width="1"/>

  <rect x="46" y="52" width="142" height="26" rx="3" fill="url(#boxiBand)"/>
  <rect x="46" y="70" width="142" height="8" fill="url(#boxiBand)"/>
  <text x="117" y="70" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="3">INTEL</text>

  <circle cx="117" cy="134" r="40" fill="#FFFFFF" stroke="#BCD0E6" stroke-width="1.4"/>
  <text x="117" y="142" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="700" fill="#2F6FAE" letter-spacing="1">CORE</text>

  <text x="117" y="198" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="700" fill="#1B2942" letter-spacing="1">i5-13400F</text>
  <text x="117" y="218" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#5A6A85" letter-spacing="2">10 CORES</text>
