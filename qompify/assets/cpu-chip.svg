<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Desktop processor">
  <defs>
    <linearGradient id="cpuIhs" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E4E9F0"/>
      <stop offset="0.45" stop-color="#AEB7C4"/>
      <stop offset="1" stop-color="#7F8896"/>
    </linearGradient>
    <linearGradient id="cpuSub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3341"/>
      <stop offset="1" stop-color="#171D28"/>
    </linearGradient>
    <linearGradient id="cpuSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="215" rx="88" ry="12" fill="#1B2942" opacity="0.12"/>

  <!-- substrate -->
  <rect x="26" y="30" width="188" height="170" rx="10" fill="url(#cpuSub)"/>
  <rect x="26" y="30" width="188" height="170" rx="10" fill="none" stroke="#49546A" stroke-width="1"/>

  <!-- corner orientation triangle -->
  <path d="M36 190 L54 190 L36 172 Z" fill="#C9A227" opacity="0.9"/>

  <!-- integrated heat spreader -->
  <rect x="44" y="46" width="152" height="138" rx="8" fill="url(#cpuIhs)"/>
  <rect x="44" y="46" width="152" height="138" rx="8" fill="url(#cpuSheen)"/>
  <rect x="52" y="54" width="136" height="122" rx="5" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.35"/>

  <!-- notches -->
  <g fill="#1F2733" opacity="0.55">
    <rect x="86" y="42" width="30" height="6" rx="3"/>
    <rect x="124" y="42" width="30" height="6" rx="3"/>
    <rect x="86" y="182" width="30" height="6" rx="3"/>
    <rect x="124" y="182" width="30" height="6" rx="3"/>
  </g>

  <text x="120" y="108" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="25" font-weight="700" fill="#454F60" letter-spacing="3">RYZEN</text>
  <text x="120" y="134" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#69738A" letter-spacing="2">6 CORES</text>
</svg>
