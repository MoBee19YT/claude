<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="Dual-fan graphics card">
  <defs>
    <linearGradient id="rtxShroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A50"/>
      <stop offset="0.55" stop-color="#1E2635"/>
      <stop offset="1" stop-color="#141A26"/>
    </linearGradient>
    <linearGradient id="rtxBracket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AEB8C7"/>
      <stop offset="1" stop-color="#7C8798"/>
    </linearGradient>
    <linearGradient id="rtxAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C86CE" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#5FA5E8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3C86CE" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="rtxHub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#46536B"/>
      <stop offset="1" stop-color="#1A2231"/>
    </radialGradient>
    <radialGradient id="rtxFanBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#0E141F"/>
      <stop offset="1" stop-color="#1B2433"/>
    </radialGradient>
    <g id="rtxBlade">
      <path d="M0,-19 C17,-23 35,-35 45,-50 C51,-59 43,-64 32,-57 C18,-48 6,-33 0,-19 Z"/>
    </g>
  </defs>

  <ellipse cx="228" cy="202" rx="180" ry="13" fill="#1B2942" opacity="0.10"/>

  <!-- PCIe bracket -->
  <rect x="4" y="16" width="18" height="180" rx="4" fill="url(#rtxBracket)"/>
  <g fill="#5B6675" opacity="0.65">
    <rect x="8" y="34" width="10" height="26" rx="2"/>
    <rect x="8" y="70" width="10" height="26" rx="2"/>
    <rect x="8" y="106" width="10" height="26" rx="2"/>
  </g>

  <!-- backplate + shroud -->
  <rect x="18" y="26" width="416" height="162" rx="12" fill="#10161F"/>
  <rect x="22" y="30" width="408" height="152" rx="10" fill="url(#rtxShroud)"/>
  <rect x="22" y="30" width="408" height="152" rx="10" fill="none" stroke="#49566D" stroke-width="1.2" opacity="0.7"/>

  <!-- top accent light -->
  <rect x="44" y="34" width="364" height="4" rx="2" fill="url(#rtxAccent)"/>

  <!-- heatsink fin hints along the bottom -->
  <g stroke="#3D4A60" stroke-width="1.6" opacity="0.5">
    <path d="M46 176 H406"/>
    <path d="M46 170 H406"/>
  </g>

  <!-- left fan -->
  <g transform="translate(140,106)">
    <circle r="66" fill="#0B1119"/>
    <circle r="62" fill="url(#rtxFanBg)"/>
    <circle r="62" fill="none" stroke="#3E4C63" stroke-width="2"/>
    <g fill="#39465C">
      <use href="#rtxBlade"/><use href="#rtxBlade" transform="rotate(40)"/><use href="#rtxBlade" transform="rotate(80)"/>
      <use href="#rtxBlade" transform="rotate(120)"/><use href="#rtxBlade" transform="rotate(160)"/><use href="#rtxBlade" transform="rotate(200)"/>
      <use href="#rtxBlade" transform="rotate(240)"/><use href="#rtxBlade" transform="rotate(280)"/><use href="#rtxBlade" transform="rotate(320)"/>
    </g>
    <circle r="21" fill="url(#rtxHub)"/>
    <circle r="21" fill="none" stroke="#53627C" stroke-width="1.2"/>
    <circle r="7" fill="#3C86CE" opacity="0.85"/>
  </g>

  <!-- right fan -->
  <g transform="translate(312,106)">
    <circle r="66" fill="#0B1119"/>
    <circle r="62" fill="url(#rtxFanBg)"/>
    <circle r="62" fill="none" stroke="#3E4C63" stroke-width="2"/>
    <g fill="#39465C">
      <use href="#rtxBlade" transform="rotate(20)"/><use href="#rtxBlade" transform="rotate(60)"/><use href="#rtxBlade" transform="rotate(100)"/>
      <use href="#rtxBlade" transform="rotate(140)"/><use href="#rtxBlade" transform="rotate(180)"/><use href="#rtxBlade" transform="rotate(220)"/>
      <use href="#rtxBlade" transform="rotate(260)"/><use href="#rtxBlade" transform="rotate(300)"/><use href="#rtxBlade" transform="rotate(340)"/>
    </g>
    <circle r="21" fill="url(#rtxHub)"/>
    <circle r="21" fill="none" stroke="#53627C" stroke-width="1.2"/>
    <circle r="7" fill="#3C86CE" opacity="0.85"/>
  </g>

  <!-- centre badge -->
  <rect x="212" y="96" width="28" height="20" rx="4" fill="#1A2231" stroke="#46536B" stroke-width="1"/>
  <circle cx="226" cy="106" r="4" fill="#5FA5E8" opacity="0.9"/>
</svg>
