<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" role="img" aria-label="Dual-fan graphics card, graphite edition">
  <defs>
    <linearGradient id="rxShroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A414D"/>
      <stop offset="0.55" stop-color="#272D38"/>
      <stop offset="1" stop-color="#1A1F27"/>
    </linearGradient>
    <linearGradient id="rxBracket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6BECA"/>
      <stop offset="1" stop-color="#848D9B"/>
    </linearGradient>
    <linearGradient id="rxAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8593F" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#D0725A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B8593F" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="rxHub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#525A68"/>
      <stop offset="1" stop-color="#20252E"/>
    </radialGradient>
    <radialGradient id="rxFanBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#131820"/>
      <stop offset="1" stop-color="#232933"/>
    </radialGradient>
    <g id="rxBlade">
      <path d="M0,-19 C17,-23 35,-35 45,-50 C51,-59 43,-64 32,-57 C18,-48 6,-33 0,-19 Z"/>
    </g>
  </defs>

  <ellipse cx="228" cy="202" rx="180" ry="13" fill="#1B2942" opacity="0.10"/>

  <rect x="4" y="16" width="18" height="180" rx="4" fill="url(#rxBracket)"/>
  <g fill="#626B79" opacity="0.65">
    <rect x="8" y="34" width="10" height="26" rx="2"/>
    <rect x="8" y="70" width="10" height="26" rx="2"/>
    <rect x="8" y="106" width="10" height="26" rx="2"/>
  </g>

  <rect x="18" y="26" width="416" height="162" rx="12" fill="#151A22"/>
  <rect x="22" y="30" width="408" height="152" rx="10" fill="url(#rxShroud)"/>
  <rect x="22" y="30" width="408" height="152" rx="10" fill="none" stroke="#565E6C" stroke-width="1.2" opacity="0.7"/>

  <rect x="44" y="34" width="364" height="4" rx="2" fill="url(#rxAccent)"/>

  <!-- brushed metal streaks -->
  <g stroke="#4A515E" stroke-width="1" opacity="0.35">
    <path d="M40 60 H420"/><path d="M40 150 H420"/>
  </g>

  <g transform="translate(140,106)">
    <circle r="66" fill="#101720"/>
    <circle r="62" fill="url(#rxFanBg)"/>
    <circle r="62" fill="none" stroke="#4B5462" stroke-width="2"/>
    <g fill="#434B59">
      <use href="#rxBlade"/><use href="#rxBlade" transform="rotate(45)"/><use href="#rxBlade" transform="rotate(90)"/>
      <use href="#rxBlade" transform="rotate(135)"/><use href="#rxBlade" transform="rotate(180)"/><use href="#rxBlade" transform="rotate(225)"/>
      <use href="#rxBlade" transform="rotate(270)"/><use href="#rxBlade" transform="rotate(315)"/>
    </g>
    <circle r="21" fill="url(#rxHub)"/>
    <circle r="21" fill="none" stroke="#636C7C" stroke-width="1.2"/>
    <circle r="7" fill="#C46A52" opacity="0.8"/>
  </g>

  <g transform="translate(312,106)">
    <circle r="66" fill="#101720"/>
    <circle r="62" fill="url(#rxFanBg)"/>
    <circle r="62" fill="none" stroke="#4B5462" stroke-width="2"/>
    <g fill="#434B59">
      <use href="#rxBlade" transform="rotate(22)"/><use href="#rxBlade" transform="rotate(67)"/><use href="#rxBlade" transform="rotate(112)"/>
      <use href="#rxBlade" transform="rotate(157)"/><use href="#rxBlade" transform="rotate(202)"/><use href="#rxBlade" transform="rotate(247)"/>
      <use href="#rxBlade" transform="rotate(292)"/><use href="#rxBlade" transform="rotate(337)"/>
    </g>
    <circle r="21" fill="url(#rxHub)"/>
    <circle r="21" fill="none" stroke="#636C7C" stroke-width="1.2"/>
    <circle r="7" fill="#C46A52" opacity="0.8"/>
  </g>

  <rect x="212" y="96" width="28" height="20" rx="4" fill="#20252E" stroke="#565E6C" stroke-width="1"/>
  <circle cx="226" cy="106" r="4" fill="#D0725A" opacity="0.85"/>
</svg>
