<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-label="Gaming PC tower with glass side panel">
  <defs>
    <linearGradient id="caseBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28323F"/>
      <stop offset="1" stop-color="#161C25"/>
    </linearGradient>
    <linearGradient id="caseGlass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1C2837" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0D141E" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="caseSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FC4EA" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#9FC4EA" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#9FC4EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caseStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C86CE" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#6FB0EE" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3C86CE" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="caseFanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#101A27"/>
      <stop offset="0.92" stop-color="#2B5F92"/>
      <stop offset="1" stop-color="#4E93D6"/>
    </radialGradient>
    <g id="caseBlade">
      <path d="M0,-9 C8,-11 17,-17 22,-25 C25,-29 21,-32 15,-28 C8,-23 3,-16 0,-9 Z"/>
    </g>
  </defs>

  <ellipse cx="160" cy="444" rx="132" ry="14" fill="#1B2942" opacity="0.12"/>

  <!-- chassis -->
  <rect x="14" y="10" width="292" height="428" rx="20" fill="url(#caseBody)"/>
  <rect x="14" y="10" width="292" height="428" rx="20" fill="none" stroke="#46536A" stroke-width="1.2" opacity="0.8"/>

  <!-- top vent -->
  <g stroke="#3A4558" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M52 26 H268"/><path d="M52 34 H268"/>
  </g>

  <!-- glass panel -->
  <rect x="30" y="46" width="260" height="376" rx="12" fill="url(#caseGlass)"/>
  <rect x="30" y="46" width="260" height="376" rx="12" fill="none" stroke="#5E82AE" stroke-width="1.4" opacity="0.5"/>

  <!-- interior: motherboard -->
  <rect x="52" y="66" width="216" height="290" rx="8" fill="#151F2D"/>
  <g stroke="#26364B" stroke-width="1.2" opacity="0.9">
    <path d="M70 92 H150"/><path d="M70 104 H132"/><path d="M186 320 H250"/>
  </g>

  <!-- vertical RGB strip -->
  <rect x="42" y="72" width="7" height="278" rx="3.5" fill="url(#caseStrip)"/>

  <!-- CPU cooler block -->
  <rect x="74" y="118" width="74" height="70" rx="8" fill="#212C3C" stroke="#3B4A61" stroke-width="1.2"/>
  <g stroke="#33425A" stroke-width="2">
    <path d="M82 130 V178"/><path d="M92 130 V178"/><path d="M102 130 V178"/><path d="M112 130 V178"/><path d="M122 130 V178"/><path d="M132 130 V178"/><path d="M140 130 V178"/>
  </g>

  <!-- RAM sticks -->
  <g fill="#2A374A" stroke="#3C4A61" stroke-width="1">
    <rect x="160" y="112" width="12" height="80" rx="3"/>
    <rect x="178" y="112" width="12" height="80" rx="3"/>
    <rect x="196" y="112" width="12" height="80" rx="3"/>
  </g>
  <g fill="#4E93D6" opacity="0.65">
    <rect x="160" y="112" width="12" height="5" rx="2.5"/>
    <rect x="178" y="112" width="12" height="5" rx="2.5"/>
    <rect x="196" y="112" width="12" height="5" rx="2.5"/>
  </g>

  <!-- graphics card inside -->
  <rect x="66" y="232" width="188" height="52" rx="7" fill="#1B2432" stroke="#3C4A61" stroke-width="1.2"/>
  <rect x="78" y="238" width="164" height="3" rx="1.5" fill="#5FA5E8" opacity="0.75"/>
  <circle cx="114" cy="260" r="16" fill="#0F1721" stroke="#3E4C63" stroke-width="1.4"/>
  <circle cx="114" cy="260" r="5" fill="#3C86CE" opacity="0.8"/>
  <circle cx="196" cy="260" r="16" fill="#0F1721" stroke="#3E4C63" stroke-width="1.4"/>
  <circle cx="196" cy="260" r="5" fill="#3C86CE" opacity="0.8"/>

  <!-- PSU shroud -->
  <rect x="52" y="310" width="216" height="46" rx="7" fill="#1A2330" stroke="#37445A" stroke-width="1.1"/>

  <!-- intake fans column -->
  <g>
    <g transform="translate(232,112)">
      <circle r="27" fill="url(#caseFanGlow)"/>
      <g fill="#33425A"><use href="#caseBlade"/><use href="#caseBlade" transform="rotate(51)"/><use href="#caseBlade" transform="rotate(102)"/><use href="#caseBlade" transform="rotate(153)"/><use href="#caseBlade" transform="rotate(204)"/><use href="#caseBlade" transform="rotate(255)"/><use href="#caseBlade" transform="rotate(306)"/></g>
      <circle r="8" fill="#212C3C" stroke="#4A5A76" stroke-width="1"/>
    </g>
    <g transform="translate(232,180)">
      <circle r="27" fill="url(#caseFanGlow)"/>
      <g fill="#33425A"><use href="#caseBlade" transform="rotate(20)"/><use href="#caseBlade" transform="rotate(71)"/><use href="#caseBlade" transform="rotate(122)"/><use href="#caseBlade" transform="rotate(173)"/><use href="#caseBlade" transform="rotate(224)"/><use href="#caseBlade" transform="rotate(275)"/><use href="#caseBlade" transform="rotate(326)"/></g>
      <circle r="8" fill="#212C3C" stroke="#4A5A76" stroke-width="1"/>
    </g>
  </g>

  <!-- glass reflection -->
  <path d="M30 46 h84 L30 300 Z" fill="url(#caseSheen)" opacity="0.9"/>

  <!-- front I/O -->
  <g fill="#4C596E">
    <circle cx="160" cy="432" r="4"/>
    <rect x="176" y="429" width="18" height="6" rx="3"/>
  </g>
</svg>
