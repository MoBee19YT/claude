<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="Memory module with black heatspreader">
  <defs>
    <linearGradient id="ramkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333C4B"/>
      <stop offset="0.5" stop-color="#1F2633"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <linearGradient id="ramkGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B56A"/>
      <stop offset="1" stop-color="#A8863F"/>
    </linearGradient>
    <linearGradient id="ramkTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C86CE" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#6FB0EE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3C86CE" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="140" rx="150" ry="9" fill="#1B2942" opacity="0.10"/>

  <!-- PCB + contacts -->
  <rect x="22" y="96" width="316" height="30" rx="4" fill="#1E2634"/>
  <g fill="url(#ramkGold)">
    <rect x="34" y="114" width="118" height="12" rx="2"/>
    <rect x="166" y="114" width="162" height="12" rx="2"/>
  </g>
  <rect x="152" y="112" width="12" height="16" rx="2" fill="#0F141C"/>

  <!-- heatspreader -->
  <path d="M26 28 h308 a6 6 0 0 1 6 6 v62 a6 6 0 0 1 -6 6 h-308 a6 6 0 0 1 -6 -6 v-62 a6 6 0 0 1 6 -6 z" fill="url(#ramkBody)"/>

  <!-- fin pattern -->
  <g stroke="#414C5F" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M44 42 V90"/><path d="M60 42 V90"/><path d="M76 42 V90"/><path d="M92 42 V90"/>
    <path d="M268 42 V90"/><path d="M284 42 V90"/><path d="M300 42 V90"/><path d="M316 42 V90"/>
  </g>

  <!-- diffuser bar -->
  <rect x="20" y="20" width="320" height="10" rx="5" fill="url(#ramkTop)"/>

  <!-- label -->
  <rect x="116" y="48" width="128" height="34" rx="5" fill="#111822" opacity="0.85"/>
  <text x="180" y="71" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#8FB8DF" letter-spacing="2">DDR5</text>
</svg>
