# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend + a managed PostgreSQL database in one shot:
# on render.com, "New +" -> "Blueprint" -> pick this repo. See README.md's
# "Deploying to production" section for the full walkthrough (including
# the one manual step Render doesn't automate: enabling the PostGIS
# extension and loading backend/db/init.sql).
#
# Render's free tier is enough to try this out, but a free web service
# spins down after ~15 minutes idle (the first request after that takes
# ~30-60s to wake up) and free Postgres databases expire after 90 days.
# Fine for a demo; upgrade the plans below for anything real.
databases:
  - name: parking-db
    plan: free
    databaseName: parking
    user: parking

services:
  - type: web
    name: parking-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parking-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-username.github.io
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
      - key: OSM_LIVE_FALLBACK
        value: "true"
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_CONTACT_EMAIL
        value: you@example.com
      - key: DEFAULT_BBOX
        value: "14.2246,49.9420,14.7071,50.1774"
      - key: DEFAULT_CITY
        value: Prague
      - key: DEFAULT_COUNTRY
        value: Czech Republic
      - key: TOMTOM_API_KEY
        sync: false
      - key: HERE_API_KEY
        sync: false
