# Only needed if you deploy from the command line (`npx wrangler deploy`).
# You can skip this file entirely and paste worker/index.js into the
# Cloudflare dashboard instead - see README.md.

name = "parkscope"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
